server:
  port: 8085

spring:
  application:
    name: quotation-service
  datasource:
    url: jdbc:mysql://localhost:3306/godavari_quotations?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  config:
    import: optional:configserver:http://localhost:8888
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    com.godavari: DEBUG
    org.springframework.web.servlet: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%-5level] %logger{25} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%-5level] %logger{25} - %msg%n"