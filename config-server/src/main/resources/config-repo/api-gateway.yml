server:
  port: 8087

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth
          uri: lb://user-service
          predicates:
            - Path=/auth/**

        - id: users
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: products
          uri: lb://product-service
          predicates:
            - Path=/products/**

        - id: orders
          uri: lb://order-service
          predicates:
            - Path=/orders/**

        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**

        - id: quotations
          uri: lb://quotation-service
          predicates:
            - Path=/quotations/**

        - id: billing
          uri: lb://billing-service
          predicates:
            - Path=/billing/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: INFO
